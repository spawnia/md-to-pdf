name: Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_REGION: ams
  FLY_ORG: personal

jobs:
  preview:
    name: Deploy preview app to fly.io
    runs-on: ubuntu-latest
    # Secrets are unavailable to workflows triggered by forks,
    # and untrusted code should not be deployed anyways.
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: preview-${{ github.event.number }}
    environment:
      name: preview-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy preview app to fly.io
        id: deploy
        uses: superfly/fly-pr-review-apps@1.6.0
        with:
          name: md-to-pdf-pr-${{ github.event.number }}
          # PDF conversion through pandoc/weasyprint needs more than the 256MB default
          memory: 512
